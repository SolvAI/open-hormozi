<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #e2e8f0;
    padding: 32px;
    color: #1e293b;
  }
  .browser {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
  }
  .browser-bar {
    background: #f8fafc;
    padding: 10px 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid #e2e8f0;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #fca5a5; } .dot.y { background: #fcd34d; } .dot.g { background: #86efac; }
  .url-bar {
    flex: 1; background: white; border-radius: 6px;
    padding: 4px 12px; font-size: 11px; color: #94a3b8; margin-left: 8px;
  }
  .page-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: #64748b; background: #f1f5f9;
    padding: 2px 8px; border-radius: 4px;
  }

  .hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: white;
    padding: 48px 40px;
    text-align: center;
  }
  .hero h1 { font-size: 28px; font-weight: 800; line-height: 1.25; margin-bottom: 10px; max-width: 650px; margin-left: auto; margin-right: auto; }
  .hero p { font-size: 15px; opacity: 0.8; max-width: 520px; margin: 0 auto 20px; line-height: 1.6; }
  .btn {
    display: inline-block; padding: 12px 32px; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none;
  }
  .btn-primary { background: #e94560; color: white; }
  .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; margin-left: 8px; }

  .section { padding: 32px 40px; border-bottom: 1px solid #f1f5f9; }
  .section:last-child { border-bottom: none; }
  .section-tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.2px; color: #e94560; margin-bottom: 8px;
  }
  .section h2 { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #0f172a; }
  .section p, .section .body { font-size: 14px; line-height: 1.7; color: #475569; }
  .section ul { padding-left: 20px; margin-top: 8px; }
  .section li { font-size: 14px; line-height: 1.7; color: #475569; margin-bottom: 4px; }

  .testimonials { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .testimonial {
    background: #f8fafc; border-left: 3px solid #3b82f6;
    padding: 12px 16px; border-radius: 0 8px 8px 0;
    font-size: 13px; font-style: italic; color: #475569; line-height: 1.6;
  }

  .offer-items { margin-top: 12px; }
  .offer-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0; font-size: 14px; color: #334155;
  }
  .offer-item::before {
    content: '✓'; color: #22c55e; font-weight: 700; font-size: 16px; flex-shrink: 0;
  }

  .guarantee-box {
    background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
    border: 1px solid #bbf7d0;
    border-radius: 10px; padding: 20px; text-align: center; margin-top: 8px;
  }
  .guarantee-box .shield { font-size: 28px; margin-bottom: 8px; }
  .guarantee-box p { font-size: 14px; color: #166534; line-height: 1.6; }

  .faq-item { padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .faq-item:last-child { border-bottom: none; }
  .faq-q { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
  .faq-a { font-size: 13px; color: #64748b; line-height: 1.6; }

  .final-cta {
    background: #0f172a; color: white; padding: 36px; text-align: center;
  }
  .final-cta h2 { font-size: 22px; margin-bottom: 14px; }
  .final-cta .btn-primary { font-size: 16px; padding: 14px 40px; }

  .annotation {
    text-align: center; font-size: 9px; color: #94a3b8;
    padding: 10px; border-top: 1px solid #f1f5f9;
  }
</style>
</head>
<body>
  <div class="browser">
    <div class="browser-bar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="url-bar">www.your-site.com/offer</div>
      <div class="page-badge" id="page-type-badge"></div>
    </div>
    <div id="page"></div>
    <div class="annotation">Landing Page Wireframe — Preview with Real Content</div>
  </div>

  <script>
    const DATA = __DATA_PLACEHOLDER__;
    const page = document.getElementById('page');

    document.getElementById('page-type-badge').textContent = DATA.page_type || 'landing page';

    if (DATA.hero) {
      const h = DATA.hero;
      const hero = document.createElement('div');
      hero.className = 'hero';
      hero.innerHTML =
        '<h1>' + esc(h.headline || '') + '</h1>' +
        '<p>' + esc(h.subheadline || '') + '</p>' +
        '<a class="btn btn-primary">' + esc(h.cta_text || 'Get Started') + '</a>';
      page.appendChild(hero);
    }

    (DATA.sections || []).forEach(sec => {
      if (sec.type === 'final_cta') {
        const div = document.createElement('div');
        div.className = 'final-cta';
        div.innerHTML =
          '<h2>' + esc(sec.headline || 'Ready to Get Started?') + '</h2>' +
          '<a class="btn btn-primary">' + esc(sec.cta_text || 'Get Started Now') + '</a>';
        page.appendChild(div);
        return;
      }

      const div = document.createElement('div');
      div.className = 'section';
      let html = '<div class="section-tag">' + esc(typeLabel(sec.type)) + '</div>';

      if (sec.headline) html += '<h2>' + esc(sec.headline) + '</h2>';
      if (sec.body) html += '<div class="body">' + esc(sec.body) + '</div>';

      if (sec.testimonials && sec.testimonials.length) {
        html += '<div class="testimonials">';
        sec.testimonials.forEach(t => {
          html += '<div class="testimonial">"' + esc(t) + '"</div>';
        });
        html += '</div>';
      }

      if (sec.items && sec.items.length && sec.type === 'offer') {
        html += '<div class="offer-items">';
        sec.items.forEach(item => {
          html += '<div class="offer-item">' + esc(item) + '</div>';
        });
        html += '</div>';
      }

      if (sec.type === 'guarantee' && sec.text) {
        html += '<div class="guarantee-box"><div class="shield">🛡️</div>' +
          '<p>' + esc(sec.text) + '</p></div>';
      }

      if (sec.items && sec.type === 'faq') {
        sec.items.forEach(faq => {
          html += '<div class="faq-item">' +
            '<div class="faq-q">' + esc(faq.q || '') + '</div>' +
            '<div class="faq-a">' + esc(faq.a || '') + '</div></div>';
        });
      }

      div.innerHTML = html;
      page.appendChild(div);
    });

    function typeLabel(t) {
      const map = {
        'problem': 'The Problem', 'proof': 'Social Proof',
        'offer': 'What You Get', 'guarantee': 'Our Guarantee',
        'faq': 'Frequently Asked Questions', 'solution': 'The Solution',
      };
      return map[t] || t || 'Section';
    }
    function esc(t) { return (t||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
