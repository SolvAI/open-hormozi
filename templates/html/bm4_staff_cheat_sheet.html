<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: A4; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: white;
    color: #1e293b;
    width: 1100px;
    padding: 0;
  }
  .page {
    padding: 36px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 3px solid #1a1a2e;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 800;
    color: #1a1a2e;
  }
  .header .subtitle {
    font-size: 12px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .card {
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 20px;
    background: #fafbfc;
    page-break-inside: avoid;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: white;
    background: #1a1a2e;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .card-title.greeting { background: #2563eb; }
  .card-title.upsell { background: #16a34a; }
  .card-title.complaint { background: #dc2626; }
  .card-title.farewell { background: #7c3aed; }
  .speech {
    background: white;
    border-left: 3px solid #3b82f6;
    padding: 10px 14px;
    margin: 8px 0;
    font-size: 14px;
    line-height: 1.6;
    border-radius: 0 6px 6px 0;
    color: #334155;
  }
  .label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .fallback {
    font-size: 12px;
    color: #64748b;
    font-style: italic;
    padding-left: 14px;
    border-left: 2px solid #e2e8f0;
  }
  .steps {
    list-style: none;
    padding: 0;
    counter-reset: step;
  }
  .steps li {
    font-size: 13px;
    line-height: 1.7;
    padding: 4px 0 4px 28px;
    position: relative;
    color: #334155;
    counter-increment: step;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0; top: 5px;
    width: 20px; height: 20px;
    background: #e94560;
    color: white;
    font-size: 11px;
    font-weight: 700;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .footer {
    text-align: center;
    font-size: 9px;
    color: #94a3b8;
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid #e2e8f0;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <h1 id="biz-name"></h1>
        <div class="subtitle">Team Cheat Sheet — Essential Scripts</div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer">Staff Cheat Sheet — Print and display in break room</div>
  </div>

  <script>
    const DATA = __DATA_PLACEHOLDER__;

    document.getElementById('biz-name').textContent = DATA.business_name || 'My Business';

    const grid = document.getElementById('grid');
    const colorMap = {
      'greeting': 'greeting', 'welcome': 'greeting',
      'upsell': 'upsell', 'sale': 'upsell',
      'complaint': 'complaint', 'issue': 'complaint',
      'farewell': 'farewell', 'goodbye': 'farewell'
    };

    function getColor(title) {
      const t = title.toLowerCase();
      for (const [key, cls] of Object.entries(colorMap)) {
        if (t.includes(key)) return cls;
      }
      return 'upsell';
    }

    (DATA.sections || []).forEach(section => {
      const card = document.createElement('div');
      card.className = 'card';

      let html = '<div class="card-title ' + getColor(section.title) + '">' +
        (section.title || '').replace(/</g, '&lt;') + '</div>';

      if (section.script) {
        html += '<div class="label">What to say</div>';
        html += '<div class="speech">' + section.script.replace(/</g, '&lt;') + '</div>';
      }

      if (section.if_no) {
        html += '<div class="label">If declined</div>';
        html += '<div class="fallback">' + section.if_no.replace(/</g, '&lt;') + '</div>';
      }

      if (section.steps) {
        html += '<div class="label">Steps</div><ol class="steps">';
        section.steps.forEach(s => {
          html += '<li>' + s.replace(/</g, '&lt;') + '</li>';
        });
        html += '</ol>';
      }

      card.innerHTML = html;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
