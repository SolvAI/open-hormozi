<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    padding: 36px;
  }
  .container { max-width: 1140px; margin: 0 auto; }
  h1 {
    font-size: 20px; font-weight: 700; color: #1a1a2e;
    text-align: center; margin-bottom: 8px;
  }
  .subtitle {
    text-align: center; font-size: 12px; color: #64748b; margin-bottom: 28px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 20px;
  }
  .creative-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .card-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tier-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .tier-badge.hot { background: #fef2f2; color: #dc2626; }
  .tier-badge.warm { background: #fffbeb; color: #d97706; }
  .tier-badge.cool { background: #eff6ff; color: #2563eb; }
  .tier-badge.engaged { background: #f0fdf4; color: #16a34a; }
  .format-tag {
    font-size: 10px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .visual-area {
    background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    padding: 24px;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .visual-desc {
    font-size: 12px;
    color: #64748b;
    background: rgba(255,255,255,0.85);
    padding: 12px 16px;
    border-radius: 8px;
    line-height: 1.5;
    max-width: 280px;
    text-align: center;
  }
  .visual-desc::before {
    content: '📷 ';
  }
  .copy-area {
    padding: 16px;
  }
  .copy-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .copy-headline {
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 6px;
  }
  .copy-body {
    font-size: 12px;
    line-height: 1.6;
    color: #475569;
    margin-bottom: 10px;
  }
  .cta-row {
    display: flex;
    justify-content: flex-end;
  }
  .cta-btn {
    font-size: 11px;
    font-weight: 600;
    color: white;
    background: #3b82f6;
    padding: 6px 16px;
    border-radius: 4px;
  }
  .tier-badge.hot + .format-tag ~ .cta-btn,
  .hot .cta-btn { background: #dc2626; }
  .footer {
    text-align: center;
    font-size: 10px;
    color: #94a3b8;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Retargeting — Creatives by Audience</h1>
    <div class="subtitle">Different messages for each intent level</div>
    <div class="grid" id="grid"></div>
    <div class="footer">Retargeting Creative Briefs — Previews</div>
  </div>

  <script>
    const DATA = __DATA_PLACEHOLDER__;
    const grid = document.getElementById('grid');

    const tierLabels = {
      'hot': '🔥 Hot — Ready to Buy',
      'warm': '🌡️ Warm — Interested',
      'cool': '❄️ Cool — Discovery',
      'engaged': '⚡ Engaged — Active'
    };

    (DATA.creatives || []).forEach(cr => {
      const card = document.createElement('div');
      card.className = 'creative-card';
      const tier = (cr.audience_tier || 'warm').toLowerCase();

      card.innerHTML =
        '<div class="card-header">' +
          '<span class="tier-badge ' + tier + '">' + esc(tierLabels[tier] || tier) + '</span>' +
          '<span class="format-tag">' + esc(cr.format || 'static') + '</span>' +
        '</div>' +
        '<div class="visual-area">' +
          '<div class="visual-desc">' + esc(cr.visual_description || 'Visual to produce') + '</div>' +
        '</div>' +
        '<div class="copy-area">' +
          '<div class="copy-label">Headline</div>' +
          '<div class="copy-headline">' + esc(cr.headline || '') + '</div>' +
          '<div class="copy-label">Body Copy</div>' +
          '<div class="copy-body">' + esc(cr.body || '') + '</div>' +
          '<div class="cta-row">' +
            '<div class="cta-btn">' + esc(cr.cta || 'Learn More') + '</div>' +
          '</div>' +
        '</div>';

      grid.appendChild(card);
    });

    function esc(t) { return (t||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
