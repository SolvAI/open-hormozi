<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f1f3f4;
    padding: 40px;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #202124;
    margin-bottom: 24px;
    text-align: center;
  }
  .ads-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: center;
  }
  .ad-card {
    background: white;
    border-radius: 10px;
    padding: 24px 28px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    max-width: 620px;
  }
  .ad-label {
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9aa0a6;
    margin-bottom: 14px;
  }
  .google-ad .ad-sponsored {
    font-size: 12px;
    color: #202124;
    margin-bottom: 2px;
  }
  .google-ad .ad-sponsored span {
    font-size: 11px;
    font-weight: 700;
    color: #202124;
    background: none;
    display: inline-block;
    margin-right: 6px;
  }
  .google-ad .ad-sponsored .badge {
    font-size: 10px;
    color: #70757a;
    font-weight: 400;
  }
  .google-ad .ad-url {
    font-size: 13px;
    color: #202124;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .google-ad .ad-url .domain {
    color: #202124;
    font-size: 13px;
  }
  .google-ad .ad-url .path {
    color: #5f6368;
    font-size: 13px;
  }
  .google-ad .ad-title {
    font-size: 19px;
    color: #1a0dab;
    line-height: 1.3;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .google-ad .ad-title:hover { text-decoration: underline; }
  .google-ad .ad-desc {
    font-size: 13px;
    color: #4d5156;
    line-height: 1.5;
    max-width: 580px;
  }
  .google-ad .sitelinks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 24px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #ebebeb;
  }
  .google-ad .sitelink {
    font-size: 13px;
    color: #1a0dab;
    cursor: pointer;
    padding: 2px 0;
  }
  .google-ad .sitelink:hover { text-decoration: underline; }
  .ad-number {
    font-family: -apple-system, sans-serif;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #e8eaed;
    color: #5f6368;
    font-size: 11px;
    font-weight: 600;
    margin-right: 8px;
  }
  .footer {
    font-family: -apple-system, sans-serif;
    text-align: center;
    font-size: 10px;
    color: #9aa0a6;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Google Ads — Ad Previews</h1>
    <div class="ads-grid" id="ads-grid"></div>
    <div class="footer">Ad Previews — Responsive Search Ad Format</div>
  </div>

  <script>
    const DATA = __DATA_PLACEHOLDER__;
    const grid = document.getElementById('ads-grid');

    (DATA.ads || []).forEach((ad, i) => {
      const card = document.createElement('div');
      card.className = 'ad-card';

      const url = ad.display_url || 'example.com';
      const domain = url.split('/')[0];
      const paths = url.split('/').slice(1).filter(Boolean);
      const pathStr = paths.length ? ' › ' + paths.join(' › ') : '';

      let headlines = [ad.headline1, ad.headline2, ad.headline3].filter(Boolean);
      let descs = [ad.description1, ad.description2].filter(Boolean);
      let sitelinksHtml = '';

      if (ad.sitelinks && ad.sitelinks.length) {
        sitelinksHtml = '<div class="sitelinks">' +
          ad.sitelinks.map(s => '<div class="sitelink">' + esc(s) + '</div>').join('') +
          '</div>';
      }

      card.innerHTML =
        '<div class="ad-label"><span class="ad-number">' + (i+1) + '</span>Ad Group ' + (i+1) + '</div>' +
        '<div class="google-ad">' +
          '<div class="ad-sponsored"><span>Sponsored</span><span class="badge">·</span></div>' +
          '<div class="ad-url"><span class="domain">' + esc(domain) + '</span>' +
            '<span class="path">' + esc(pathStr) + '</span></div>' +
          '<div class="ad-title">' + headlines.map(esc).join(' | ') + '</div>' +
          '<div class="ad-desc">' + descs.map(esc).join(' ') + '</div>' +
          sitelinksHtml +
        '</div>';

      grid.appendChild(card);
    });

    function esc(t) { return (t||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
