[project]
name = "open-hormozi"
version = "1.0.0"
description = "Open-source alternative to ACQ AI: generate a complete Hormozi-style acquisition strategy on your own computer with your own Anthropic API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "playwright>=1.48",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
